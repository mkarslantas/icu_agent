# ICU Patient Monitoring System - Reference Ranges
# Normal laboratory values and critical thresholds for adult ICU patients

hematology:
  hemoglobin:
    unit: "g/dL"
    male:
      normal_min: 13.5
      normal_max: 17.5
    female:
      normal_min: 12.0
      normal_max: 15.5
    anemia:
      mild: 10.0
      moderate: 8.0
      severe: 6.5
    critical_low: 7.0
    critical_high: 20.0

  white_blood_cells:
    unit: "K/µL"
    normal_min: 4.0
    normal_max: 11.0
    leukopenia:
      mild: 3.0
      moderate: 2.0
      severe: 1.0
    leukocytosis:
      mild: 12.0
      moderate: 15.0
      severe: 20.0
    critical_low: 1.0
    critical_high: 30.0

  platelet:
    unit: "K/µL"
    normal_min: 150
    normal_max: 400
    thrombocytopenia:
      mild: 100
      moderate: 50
      severe: 20
    critical_low: 20
    critical_high: 1000

chemistry:
  sodium:
    unit: "mEq/L"
    normal_min: 136
    normal_max: 145
    critical_low: 120
    critical_high: 160

  potassium:
    unit: "mEq/L"
    normal_min: 3.5
    normal_max: 5.0
    critical_low: 2.5
    critical_high: 6.5

  chloride:
    unit: "mEq/L"
    normal_min: 98
    normal_max: 107
    critical_low: 80
    critical_high: 120

  bicarbonate:
    unit: "mEq/L"
    normal_min: 22
    normal_max: 29
    critical_low: 10
    critical_high: 40

  bun:
    unit: "mg/dL"
    normal_min: 7
    normal_max: 20
    critical_high: 100

  creatinine:
    unit: "mg/dL"
    normal_min: 0.6
    normal_max: 1.2
    critical_high: 5.0
    aki_stages:
      stage1_min: 1.5  # 1.5x baseline
      stage2_min: 2.0  # 2x baseline
      stage3_min: 3.0  # 3x baseline or ≥4.0
      stage3_absolute: 4.0

  glucose:
    unit: "mg/dL"
    normal_min: 70
    normal_max: 100
    target_icu_min: 140
    target_icu_max: 180
    hypoglycemia:
      mild: 60
      moderate: 50
      severe: 40
    critical_low: 40
    critical_high: 400

liver:
  ast:
    unit: "U/L"
    normal_max: 40
    critical_high: 1000

  alt:
    unit: "U/L"
    normal_max: 41
    critical_high: 1000

  bilirubin_total:
    unit: "mg/dL"
    normal_max: 1.2
    jaundice_threshold: 2.0
    critical_high: 12.0

  albumin:
    unit: "g/dL"
    normal_min: 3.5
    normal_max: 5.5
    critical_low: 2.0

coagulation:
  pt:
    unit: "seconds"
    normal_min: 11
    normal_max: 13.5
    critical_high: 30

  inr:
    normal_min: 0.8
    normal_max: 1.2
    critical_high: 5.0

  aptt:
    unit: "seconds"
    normal_min: 25
    normal_max: 35
    critical_high: 100

  fibrinogen:
    unit: "mg/dL"
    normal_min: 200
    normal_max: 400
    critical_low: 100

  d_dimer:
    unit: "µg/mL FEU"
    normal_max: 0.5
    elevated: 1.0
    very_high: 5.0

blood_gas:
  ph:
    normal_min: 7.35
    normal_max: 7.45
    acidosis_mild: 7.30
    acidosis_moderate: 7.20
    acidosis_severe: 7.10
    alkalosis_mild: 7.50
    alkalosis_moderate: 7.55
    critical_low: 7.20
    critical_high: 7.60

  pco2:
    unit: "mmHg"
    normal_min: 35
    normal_max: 45
    critical_low: 20
    critical_high: 80

  po2:
    unit: "mmHg"
    normal_min: 80
    normal_max: 100
    hypoxemia:
      mild: 70
      moderate: 60
      severe: 50
    critical_low: 50

  hco3:
    unit: "mEq/L"
    normal_min: 22
    normal_max: 26
    critical_low: 10
    critical_high: 40

  base_excess:
    unit: "mEq/L"
    normal_min: -2
    normal_max: 2
    critical_low: -10
    critical_high: 10

  lactate:
    unit: "mmol/L"
    normal_max: 2.0
    elevation:
      mild: 2.5
      moderate: 4.0
      severe: 8.0
    critical_high: 4.0

vitals:
  heart_rate:
    unit: "bpm"
    normal_min: 60
    normal_max: 100
    bradycardia:
      mild: 50
      moderate: 40
      severe: 30
    tachycardia:
      mild: 110
      moderate: 130
      severe: 150
    critical_low: 40
    critical_high: 180

  blood_pressure:
    systolic:
      unit: "mmHg"
      normal_min: 90
      normal_max: 140
      critical_low: 70
      critical_high: 200
    diastolic:
      unit: "mmHg"
      normal_min: 60
      normal_max: 90
      critical_low: 40
      critical_high: 120
    map:
      unit: "mmHg"
      target_min: 65
      normal_min: 70
      normal_max: 105
      critical_low: 65
      critical_high: 130

  respiratory_rate:
    unit: "/min"
    normal_min: 12
    normal_max: 20
    bradypnea: 10
    tachypnea:
      mild: 24
      moderate: 30
      severe: 40
    critical_low: 8
    critical_high: 40

  spo2:
    unit: "%"
    normal_min: 95
    hypoxemia:
      mild: 92
      moderate: 88
      severe: 85
    critical_low: 90

  temperature:
    unit: "celsius"
    normal_min: 36.5
    normal_max: 37.5
    hypothermia:
      mild: 35.0
      moderate: 32.0
      severe: 28.0
    fever:
      low_grade: 37.8
      moderate: 38.5
      high: 39.5
    critical_low: 35.0
    critical_high: 40.0

oxygenation:
  fio2:
    unit: "%"
    room_air: 21
    standard_max: 100

  pf_ratio:
    unit: "mmHg"
    normal_min: 400
    ards:
      mild: 300  # 200-300
      moderate: 200  # 100-200
      severe: 100  # <100

urine_output:
  hourly:
    unit: "mL/hr"
    adequate_min: 30  # ~0.5 mL/kg/hr for 70kg
    oliguria: 21  # <0.3 mL/kg/hr
    anuria: 7  # <0.1 mL/kg/hr

  per_kg_per_hour:
    unit: "mL/kg/hr"
    adequate_min: 0.5
    oliguria: 0.3
    anuria: 0.1

inflammatory_markers:
  crp:
    unit: "mg/L"
    normal_max: 10
    elevated:
      mild: 50
      moderate: 100
      severe: 200

  procalcitonin:
    unit: "ng/mL"
    normal_max: 0.1
    interpretation:
      low_risk: 0.5
      moderate_risk: 2.0
      high_risk: 10.0
      very_high_risk: 50.0

cardiac_markers:
  troponin_i:
    unit: "ng/mL"
    normal_max: 0.04
    myocardial_infarction: 0.4

  bnp:
    unit: "pg/mL"
    normal_max: 100
    heart_failure: 400

  nt_pro_bnp:
    unit: "pg/mL"
    normal_max: 125
    heart_failure: 900

critical_thresholds:
  immediate_intervention:
    - parameter: "MAP"
      condition: "< 65 mmHg"
      severity: "life-threatening"
    - parameter: "Lactate"
      condition: "> 4 mmol/L"
      severity: "critical"
    - parameter: "GCS"
      condition: "< 8"
      severity: "life-threatening"
    - parameter: "SpO2"
      condition: "< 90%"
      severity: "critical"
    - parameter: "Potassium"
      condition: "< 2.5 or > 6.5 mEq/L"
      severity: "life-threatening"
    - parameter: "Glucose"
      condition: "< 40 or > 400 mg/dL"
      severity: "critical"
    - parameter: "pH"
      condition: "< 7.2 or > 7.6"
      severity: "life-threatening"
    - parameter: "Hemoglobin"
      condition: "< 7 g/dL"
      severity: "critical"
    - parameter: "Platelet"
      condition: "< 20 K/µL"
      severity: "critical"
    - parameter: "Urine Output"
      condition: "< 0.5 mL/kg/hr"
      severity: "urgent"
    - parameter: "Heart Rate"
      condition: "< 40 or > 180 bpm"
      severity: "critical"
    - parameter: "Temperature"
      condition: "< 35°C or > 40°C"
      severity: "urgent"
